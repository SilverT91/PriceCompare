# Slovak versions of the free-text notes in shops.yaml that the page shows.
#
# Keyed by shop id, with the same field names as shops.yaml. Only two fields are shown on the page
# and so translated here:
#   no_route_reason        shown in the shop's detail when it has no automatic route
#   shipping_to_sk.method  shown in the delivery note of an offer when the delivery price comes from
#                          shops.yaml
# A shop or field missing here is shown in English. The facts stay exactly as in shops.yaml (prices,
# dates, shop and carrier names, URLs); only the decimal point is written as a comma, as in Slovak.
# When a note in shops.yaml changes, change it here too: the app does not notice a stale translation.
# Loaded by src/node/setup.ts (loadShopTexts); checked by validateShopTexts in src/core/shops.ts.

shops:
  nay_sk:
    shipping_to_sk:
      method: "výdajné miesto Packeta alebo Slovenskej pošty (kuriér na adresu stojí viac; jeho cena sa nezistila)"

  euronics_sk:
    no_route_reason: "vyhľadávací formulár na úvodnej stránke nemá atribút action a obsluhuje ho JavaScript (/?term=... vráti úvodnú stránku), preto neexistuje jednoduchá adresa vyhľadávania"

  hornbach_sk:
    shipping_to_sk:
      method: "balík; zadarmo pre balíky od 99 EUR (cenu pod touto hranicou nebolo možné prečítať: stránka o doprave vyžaduje JavaScript)"

  obi_sk:
    no_route_reason: "obi.sk odpovedá jednoduchému HTTP klientovi na každú stránku vrátane úvodnej prázdnou odpoveďou HTTP 404 (2026-11-24), preto sa adresu vyhľadávania nepodarilo nájsť"

  mountfield_sk:
