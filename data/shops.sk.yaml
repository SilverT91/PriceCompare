    shipping_to_sk:
      method: "výdajné miesto SPS Parcel Shop alebo Balíkovobox 1,99 €; kuriér SPS 2,99 €; Packeta Z-box alebo výdajné miesto 2,99 €; kuriér Packeta 3,49 €; na adresu zadarmo od 49 € (nevzťahuje sa na príplatok za nadrozmerný balík); na výdajné miesta jeden balík do 10 kg; dobierka 1,00 €"

