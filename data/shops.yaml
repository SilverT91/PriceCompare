# PriceCompare seed shop database.
#
# Last reviewed: 2026-11-24. Checked by: fetching each homepage with a plain HTTP client, reading
# store-locator pages where they were reachable, and news/web search. See `excluded` at the bottom
# for shops that were considered and are gone.
#
# Field notes
#   kind                   local_chain = has physical branches in Slovakia; webshop = online only
#                          (or physical presence is marginal).
#   categories             vocabulary: electronics, appliances, tools, diy_garden, drugstore, pharmacy,
#                          beauty, furniture, home, books, grocery, general
#   in_scope               false = groceries; the tool covers non-food goods only (scope update
#                          2026-11-24). Kept in the file, not probed.
#   has_kosice_branch      true / false / unknown. true carries has_kosice_branch_source.
#   ships_to_sk            true / false / unknown. Slovak shops are true by definition.
#   search_url_template    shop's own search URL with {query} (URL-encoded by the caller), or null.
#   search_template_basis  how the template was found:
#                            searchaction = schema.org SearchAction in the homepage JSON-LD
#                            form         = <form> found on the homepage
#                            guess        = from memory of the shop's URL scheme, NOT checked;
#                                           treat a 404 in the probe as "template wrong", not "shop broken"
#   search_url_template    placeholders: {query} = form encoding (spaces as +),
#                          {query_path} = percent encoding (spaces as %20) for path-style templates.
#   accept_language        optional Accept-Language override sent to this shop (default sk,cs,en).
#   link_exclude_regex     optional regex; search-page links matching it are never taken as products
#                          (used to skip sponsored click-tracking links).
#   notes                  free text; "unverified" means exactly that.
#
# Fields added for the app (2026-11-24):
#   categories             also decide which shops a search asks: a query's guessed categories must meet
#                          the shop's (shops with "general" are asked for every category).
#   shipping_to_sk         cheapest standard delivery to Slovakia, used only when the product page's
#                          JSON-LD has no shippingDetails for SK:
#                            {price: 3.99, currency: EUR, free_from: 50, method: <text>, source: <url>, checked: <date>}
#                          price null with free_from set = free from that order value, unknown below it.
#                          null = unknown (shown as unknown, never counted as zero).
#   ships_to_sk_source     where ships_to_sk: false (or true for a foreign shop) was read. Offers of shops
#                          with ships_to_sk: false stay visible, marked, and outside the ranking.
#   pickup_kosice          collecting an online order in the Košice branch (shops with has_kosice_branch):
#                            {available: true/false/unknown, price, currency, note, source, checked}
#   no_route_reason        why the shop has no search URL (shown with status no_route).
#   unreachable            true = the site answers a plain client with errors on every page; not asked at all.
#   needs_js               true = prices only appear after JavaScript runs (probe 2026-11-24); the app
#                          does not fetch the shop and gives the manual link instead.
#   structured_data        false = product pages carry no schema.org data (probe 2026-11-24); same handling.
#   branches               reserved for per-branch data (address, stock) later; not used yet.

